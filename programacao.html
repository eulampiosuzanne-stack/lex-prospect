<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lex Prospect — Programação Social Media</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#09090b;--p:#121216;--l:#29292f;--t:#f5f5f6;--m:#9999a3;--r:#ef2b36;--g:#2ccb7f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px Inter,system-ui,sans-serif}main{max-width:1300px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.ey{color:var(--r);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px}h1{margin:5px 0}.muted{color:var(--m)}button,a.btn{border:1px solid var(--l);background:#17171b;color:#fff;border-radius:9px;padding:9px 12px;text-decoration:none;cursor:pointer}.primary{background:var(--r);border-color:var(--r)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:13px}.card{border:1px solid var(--l);background:var(--p);border-radius:14px;padding:16px}.head{display:flex;justify-content:space-between;gap:8px}.badge{padding:4px 8px;border-radius:20px;background:#ef2b3618;color:#ff858b;font-size:12px}.field{margin-top:12px}.field b{display:block;font-size:12px;color:var(--m);margin-bottom:4px;text-transform:uppercase}.field p{margin:0;white-space:pre-wrap;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1}.ok{color:#78e8ad}.empty{padding:28px;border:1px dashed var(--l);border-radius:14px;color:var(--m)}dialog{max-width:700px;width:92%;background:#151519;color:#fff;border:1px solid #393940;border-radius:14px;padding:20px}textarea,input,select{width:100%;background:#0c0c0f;color:#fff;border:1px solid #33333a;border-radius:8px;padding:10px;margin:5px 0 10px}textarea{min-height:120px}@media(max-width:600px){main{padding:16px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main><div class="top"><div><div class="ey">Social Media → Programação</div><h1>Conteúdos programados</h1><div class="muted">Feed, Stories e Reels com roteiro, legenda, mídia, data, hora e aprovação.</div></div><div><a class="btn" href="/">← Painel</a> <button id="reload">↻ Atualizar</button></div></div><div class="filters"><button data-f="all" class="primary">Todos</button><button data-f="tomorrow">Amanhã</button><button data-f="feed">Feed</button><button data-f="story">Stories</button><button data-f="reels">Reels</button></div><div id="state" class="muted">Carregando…</div><section id="cards" class="cards"></section></main><dialog id="dlg"><h2 id="dlgTitle">Editar publicação</h2><label>Data e hora</label><input id="dt" type="datetime-local"><label>Legenda</label><textarea id="cap"></textarea><label>Mídia URL</label><input id="media"><div class="actions"><button onclick="dlg.close()">Cancelar</button><button class="primary" id="save">Salvar</button></div></dialog><script>const URL='https://jnctyowjstchfofqfhnm.supabase.co',KEY='sb_publishable_ZBPR_AtzIi2kYH8XO1Jffg_iKnCdE0X',db=supabase.createClient(URL,KEY);let rows=[],filter='all',editing=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const local=d=>d?new Date(d).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'Sem agendamento';function tomorrow(x){if(!x)return false;const a=new Date(),b=new Date(x);const f=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);const t=new Date(a.getTime()+86400000);return f(b)===f(t)}function render(){let a=rows;if(filter==='tomorrow')a=a.filter(x=>tomorrow(x.horario_agendado));else if(filter!=='all')a=a.filter(x=>x.tipo_post===filter);cards.innerHTML=a.length?a.map(x=>'<article class="card"><div class="head"><div><b>'+esc((x.tipo_post||'post').toUpperCase())+'</b><div class="muted">'+esc(local(x.horario_agendado))+'</div></div><span class="badge">'+esc(x.status||'')+'</span></div><div class="field"><b>Tema</b><p>'+esc(x.posts_content_scripts?.tema||'Sem tema')+'</p></div><div class="field"><b>Prompt / roteiro original</b><p>'+esc(x.posts_content_scripts?.roteiro||'Não informado')+'</p></div><div class="field"><b>Legenda</b><p>'+esc(x.legenda||x.posts_content_scripts?.legenda||'')+'</p></div><div class="field"><b>Mídia</b><p>'+esc(x.midia_url||'Ainda não anexada')+'</p></div><div class="actions"><button onclick="viewPost(\''+x.id+'\')">Visualizar</button><button onclick="editPost(\''+x.id+'\')">Editar</button><button onclick="setStatus(\''+x.id+'\',\'aprovado\')">Aprovar</button><button onclick="setStatus(\''+x.id+'\',\'reprovado\')">Reprovar</button><button class="primary" onclick="publishPost(\''+x.id+'\')">Publicar</button></div></article>').join(''):'<div class="empty">Nenhum conteúdo encontrado neste filtro.</div>';state.textContent=a.length+' publicação(ões) exibida(s).'}async function load(){state.textContent='Atualizando programação…';const {data,error}=await db.from('posts_items').select('id,script_id,tipo_post,midia_url,legenda,horario_agendado,status,posts_content_scripts(tema,roteiro,legenda)').not('horario_agendado','is',null).order('horario_agendado',{ascending:true});if(error){state.textContent='Erro: '+error.message;cards.innerHTML='';return}rows=data||[];render()}window.viewPost=id=>{const x=rows.find(r=>r.id===id);if(!x)return;alert((x.tipo_post||'POST').toUpperCase()+'\n'+local(x.horario_agendado)+'\n\nTEMA\n'+(x.posts_content_scripts?.tema||'')+'\n\nROTEIRO\n'+(x.posts_content_scripts?.roteiro||'')+'\n\nLEGENDA\n'+(x.legenda||x.posts_content_scripts?.legenda||''))};window.editPost=id=>{const x=rows.find(r=>r.id===id);if(!x)return;editing=id;dt.value=x.horario_agendado?new Date(x.horario_agendado).toISOString().slice(0,16):'';cap.value=x.legenda||'';media.value=x.midia_url||'';dlg.showModal()};save.onclick=async()=>{if(!editing)return;const {error}=await db.from('posts_items').update({horario_agendado:dt.value?new Date(dt.value).toISOString():null,legenda:cap.value,midia_url:media.value||null}).eq('id',editing);if(error)return alert(error.message);dlg.close();await load()};window.setStatus=async(id,status)=>{const patch={status};if(status==='aprovado'){patch.aprovado_por='Suzanne';patch.aprovado_em=new Date().toISOString()}const {error}=await db.from('posts_items').update(patch).eq('id',id);if(error)return alert(error.message);await load()};window.publishPost=async id=>{const x=rows.find(r=>r.id===id);if(!x)return;if(!x.midia_url)return alert('Esta publicação ainda não possui mídia. Edite e informe a mídia antes de publicar.');if(!confirm('Confirmar publicação agora?'))return;const {data:{session}}=await db.auth.getSession();if(!session)return alert('Entre na Lex Prospect pelo painel principal antes de publicar.');const r=await fetch(URL+'/functions/v1/social-publish-instagram',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':KEY},body:JSON.stringify({post_id:id,confirm_publish:true})});const j=await r.json();alert(r.ok?'Publicado no Instagram.':'Não publicado: '+(j.error||'erro'));await load()};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(z=>z.classList.toggle('primary',z===b));render()});reload.onclick=load;load();</script></body></html>
